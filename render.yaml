services:
  - type: web
    name: rewardspin-bot
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: BOT_USERNAME
        sync: false
